# ============================================================
#  BinanceBot configuration
#  Every entry under `bots:` runs in parallel with its own budget.
# ============================================================

# paper   = simulated trading on real live prices (no API keys needed)
# testnet = real orders on Binance Spot Testnet (fake money)
# live    = REAL MONEY. Also requires env BINANCE_LIVE_CONFIRM=YES
mode: paper

# Public market data endpoint. If api.binance.com is blocked where you are,
# use https://data-api.binance.vision
market_data_url: https://api.binance.com

poll_seconds: 30        # how often each bot checks price / new candles
summary_minutes: 60     # print a comparison table every N minutes
fee_rate: 0.001         # 0.1% Binance spot fee (paper + backtest)
slippage_pct: 0.05      # simulated slippage per fill (paper + backtest)
db_path: data/bots.db

# Values applied to every bot unless the bot overrides them.
defaults:
  symbol: BTCUSDT
  interval: 4h
  starting_balance: 1000      # USDT budget per bot
  position_size_pct: 100      # % of the bot's equity used per trade
  stop_loss_pct: null         # e.g. 3  -> exit if price falls 3% below entry
  take_profit_pct: null       # e.g. 6  -> exit if price rises 6% above entry
  trailing_stop_pct: null     # e.g. 4  -> exit if price falls 4% from its peak
  trend_filter_ema: null      # e.g. 200 -> only BUY while close > EMA(200) of this bot's candles

bots:
  # Picked from backtests 2019-2026 (see docs/evaluation.md): trend-following on
  # 4h/1d works; 1h and mean-reversion lost to fees and noise.

  # ---------------- BTC ----------------
  # Benchmark: every strategy should beat this to be worth it.
  - name: buy_and_hold
    strategy: buy_and_hold

  # Best BTC 4h result: ~45%/yr, max drawdown 39% (buy & hold: 49%/yr, 77%).
  - name: donchian_4h_filter
    strategy: donchian_breakout
    params: {entry_period: 20, exit_period: 10}
    trend_filter_ema: 200

  - name: supertrend_4h_filter
    strategy: supertrend
    params: {period: 10, multiplier: 3.0}
    trend_filter_ema: 200

  - name: supertrend_4h
    strategy: supertrend
    params: {period: 10, multiplier: 3.0}

  # Best BTC 1d result: ~39%/yr, max drawdown 32%. Trades only a few times a year.
  - name: ema_trend_1d
    strategy: ema_trend
    interval: 1d
    params: {fast: 12, slow: 26, trend: 200}

  # ---------------- ETH ----------------
  - name: buy_and_hold_eth
    strategy: buy_and_hold
    symbol: ETHUSDT

  # Best ETH 1d result: ~53%/yr (beat buy & hold), max drawdown 53%.
  - name: supertrend_1d_eth
    strategy: supertrend
    symbol: ETHUSDT
    interval: 1d
    params: {period: 10, multiplier: 3.0}

  # ETH 4h: ~37%/yr, max drawdown 50% (buy & hold: 46%/yr, 81%).
  - name: donchian_4h_filter_eth
    strategy: donchian_breakout
    symbol: ETHUSDT
    params: {entry_period: 20, exit_period: 10}
    trend_filter_ema: 200


  # ---------------- disabled (kept for reference / re-testing) ----------------
  # Lost to buy & hold on 1h in every period tested (fees + noise).
  - name: sma_cross_20_50_1h
    strategy: sma_crossover
    interval: 1h
    params: {fast: 20, slow: 50}
    enabled: false

  - name: sma_cross_4h_filter
    strategy: sma_crossover
    params: {fast: 20, slow: 50}
    trend_filter_ema: 200
    enabled: false

  - name: donchian_4h
    strategy: donchian_breakout
    params: {entry_period: 20, exit_period: 10}
    enabled: false

  # ETH 4h 2019-2026: max drawdown 75% (worse than without the filter).
  - name: supertrend_4h_filter_eth
    strategy: supertrend
    symbol: ETHUSDT
    params: {period: 10, multiplier: 3.0}
    trend_filter_ema: 200
    enabled: false

  # Lost money on every timeframe and period tested.
  - name: rsi_reversion_14
    strategy: rsi_reversion
    params: {period: 14, oversold: 30, overbought: 70}
    stop_loss_pct: 5
    enabled: false

  - name: macd_cross_1h
    strategy: macd_cross
    interval: 1h
    params: {fast: 12, slow: 26, signal: 9}
    enabled: false

  - name: bollinger_reversion_1h
    strategy: bollinger_reversion
    interval: 1h
    params: {period: 20, num_std: 2.0, exit: middle}
    stop_loss_pct: 5
    enabled: false
